services:
  - type: cron
    runtime: node
    name: ev-jobs-cal-access
    plan: pro
    region: oregon
    schedule: 0 16 * * *
    repo: https://github.com/EmpoweredVote/ev-accounts
    branch: master
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    buildCommand: cd backend && npm install --include=dev && npm run build
    startCommand: cd backend && node --dns-result-order=verbatim dist/jobs/run.js cal-access; a=$?; node --dns-result-order=verbatim dist/jobs/run.js indiana; b=$?; [ $a -eq 0 ] && [ $b -eq 0 ]
    envVars:
      - fromGroup: ev-jobs-shared
      - key: NPM_CONFIG_INCLUDE
        sync: false
  - type: cron
    runtime: node
    name: ev-jobs-fec-burst
    plan: standard
    region: oregon
    schedule: 0 6 * * *
    repo: https://github.com/EmpoweredVote/ev-accounts
    branch: master
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    buildCommand: cd backend && npm install --include=dev && npm run build
    startCommand: cd backend && node --dns-result-order=verbatim dist/jobs/run.js fec-auto-match; a=$?; node --dns-result-order=verbatim dist/jobs/run.js fec-finance-summary; c=$?; node --dns-result-order=verbatim
      dist/jobs/run.js fec-burst; b=$?; [ $a -eq 0 ] && [ $c -eq 0 ] && [ $b -eq 0 ]
    envVars:
      - fromGroup: ev-jobs-shared
      - key: NPM_CONFIG_INCLUDE
        sync: false
  - type: cron
    runtime: node
    name: ev-jobs-la-county-netfile
    plan: starter
    region: oregon
    schedule: 0 3 1 * *
    repo: https://github.com/EmpoweredVote/ev-accounts
    branch: master
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    buildCommand: cd backend && npm install --include=dev && npm run build
    startCommand: cd backend && node --dns-result-order=verbatim dist/jobs/run.js la-county-netfile
    envVars:
      - fromGroup: ev-jobs-shared
      - key: NPM_CONFIG_INCLUDE
        sync: false
  - type: cron
    runtime: node
    name: ev-jobs-legiscan
    plan: 1c-2g
    region: oregon
    schedule: 0 14 * * 0
    repo: https://github.com/EmpoweredVote/ev-accounts
    branch: master
    autoDeployTrigger: commit
    buildCommand: cd backend && npm install --include=dev && npx tsc
    startCommand: cd backend && node dist/jobs/run.js legiscan; a=$?; node dist/jobs/run.js federal-bills; b=$?; node dist/jobs/run.js federal-votes; c=$?; [ "$a$b$c" = 000 ]
